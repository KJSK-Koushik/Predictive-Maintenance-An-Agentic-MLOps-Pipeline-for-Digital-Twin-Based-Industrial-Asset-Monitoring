[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "predictive-maintenance-mlops"
version = "0.1.0"
description = "Human-governed MLOps research prototype for C-MAPSS predictive maintenance"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "Apache-2.0"
authors = [{ name = "Project maintainers" }]
dependencies = [
  "aiohttp>=3.7,<4",
  "alembic>=1.19,<2",
  "cryptography==50.0.0",
  "docker>=4,<8",
  "fastapi>=0.116,<1",
  "flask>=3.1,<4",
  "flask-cors>=6,<7",
  "graphene>=3,<4",
  "gunicorn>=23,<27; platform_system != 'Windows'",
  "huey>=2.5.4,<4",
  "matplotlib>=3,<4",
  "mlflow-skinny>=3.15,<4",
  "mlflow-tracing>=3.15,<4",
  "pandas>=2.2,<3",
  "pandera[pandas]>=0.24,<1",
  "psycopg[binary]>=3.3.4,<4",
  "pyarrow==25.0.0",
  "pydantic>=2.11,<3",
  "scikit-learn>=1.9,<1.10",
  "skops>=0.14,<1",
  "sqlalchemy>=2,<3",
  "supabase>=2.31,<3",
  "uvicorn>=0.35,<1",
  "waitress>=3,<4; platform_system == 'Windows'",
]

[project.scripts]
publish-fd001 = "predictive_maintenance.cloud.cli:main"
run-fd001-etl = "predictive_maintenance.etl.cli:main"
evaluate-fd001-advanced = "predictive_maintenance.modeling.phase5_cli:main"
prepare-fd001-release = "predictive_maintenance.release.cli:main"
monitor-fd001 = "predictive_maintenance.monitoring.cli:main"
train-fd001-baselines = "predictive_maintenance.modeling.cli:main"
validate-fd001 = "predictive_maintenance.data.cli:main"

[dependency-groups]
inference = [
  "fastapi>=0.116,<1",
  "pandas>=2.2,<3",
  "scikit-learn>=1.9,<1.10",
  "skops>=0.14,<1",
  "uvicorn>=0.35,<1",
]
dev = [
  "httpx>=0.28,<1",
  "httpx2>=2.12,<3",
  "mdformat>=0.7.22,<0.8",
  "mdformat-gfm>=0.4.1,<0.5",
  "mypy>=1.15,<2",
  "pandas-stubs>=2.2,<3",
  "pip>=26.2,<27",
  "pip-audit>=2.8,<3",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "pyyaml>=6.0.2,<7",
  "ruff>=0.11,<0.16",
  "types-pyyaml>=6.0.12,<7",
  "yamllint>=1.37,<2",
]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["Data", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
exclude = ["^Data/", "^data/"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["tests"]
pythonpath = ["tests"]
markers = [
  "api: tests for the Phase 6 inference HTTP contract",
  "cloud: tests that require the explicitly approved hosted Supabase project",
  "dataset: tests that require the ignored owner-provided FD001 dataset",
  "foundation: repository architecture and governance contract tests",
  "integration: integration tests that span repository configuration artifacts",
  "postgres: tests that require the local PostgreSQL 17 container",
  "airflow: tests that require the pinned Airflow container",
  "mlflow: tests that start a real loopback-only MLflow tracking server",
  "registry: tests that exercise the Phase 6 local MLflow registry",
  "deployment: tests that exercise the Phase 6 container staging boundary",
]

[tool.coverage.run]
branch = true
source = ["predictive_maintenance"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 90

[tool.hatch.build.targets.wheel]
packages = ["src/predictive_maintenance"]
