[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "predictive-maintenance-mlops"
version = "0.0.0"
description = "Human-governed MLOps research prototype for C-MAPSS predictive maintenance"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "Apache-2.0"
authors = [{ name = "Project maintainers" }]
dependencies = []

[dependency-groups]
dev = [
  "mdformat>=0.7.22,<0.8",
  "mdformat-gfm>=0.4.1,<0.5",
  "mypy>=1.15,<2",
  "pip-audit>=2.8,<3",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "pyyaml>=6.0.2,<7",
  "ruff>=0.11,<0.16",
  "types-pyyaml>=6.0.12,<7",
  "yamllint>=1.37,<2",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["Data", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
exclude = ["^Data/", "^data/"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["tests"]
markers = [
  "foundation: repository architecture and governance contract tests",
  "integration: integration tests that span repository configuration artifacts",
]

[tool.coverage.run]
branch = true
source = ["tests"]

[tool.coverage.report]
show_missing = true
skip_covered = false
