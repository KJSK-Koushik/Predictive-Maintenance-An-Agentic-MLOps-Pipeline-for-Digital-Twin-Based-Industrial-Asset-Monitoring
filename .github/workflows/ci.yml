name: quality-gates

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Phase 0 quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"

      - name: Install locked environment manager
        run: python -m pip install --disable-pip-version-check uv==0.11.8

      - name: Synchronize locked development environment
        run: uv sync --locked --dev

      - name: Validate dependency lock
        run: uv lock --check

      - name: Check Python formatting
        run: uv run ruff format --check .

      - name: Lint Python
        run: uv run ruff check .

      - name: Check static types
        run: uv run mypy src tests

      - name: Run unit and contract tests
        run: uv run pytest -m "not integration and not dataset"

      - name: Run integration tests
        run: uv run pytest -m "integration and not dataset"

      - name: Enforce product coverage
        run: >-
          uv run pytest -m "not dataset"
          --cov=src/predictive_maintenance
          --cov-branch
          --cov-report=term-missing
          --cov-fail-under=90

      - name: Check Markdown formatting
        run: uv run mdformat --check README.md CONTRIBUTING.md docs

      - name: Lint YAML
        run: uv run yamllint .

      - name: Audit Python dependencies
        run: uv run pip-audit
