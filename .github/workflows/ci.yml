# Repository-wide Phase 0-5 quality gates.
name: quality-gates

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    # Keep this context stable because branch protection requires it.
    name: Phase 4 quality
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PM_POSTGRES_DSN: >-
        postgresql://postgres:phase2-local-only@127.0.0.1:55432/predictive_maintenance
      PM_CODE_REVISION: phase3-local
      PM_SOURCE_SNAPSHOT_ID: >-
        a793898150be06e5079dc92a327ab3abe298ca5f3198c10aa9c0745f840b87e2
      PM_RAW_BUCKET: pm-raw-airflow-ci
      PM_DERIVED_BUCKET: pm-derived-airflow-ci

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.11"

      - name: Install locked environment manager
        run: python -m pip install --disable-pip-version-check uv==0.11.8

      - name: Synchronize locked development environment
        run: uv sync --locked --dev

      - name: Validate dependency lock
        run: uv lock --check

      - name: Check Python formatting
        run: uv run ruff format --check .

      - name: Lint Python
        run: uv run ruff check .

      - name: Check static types
        run: uv run mypy src tests

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Start disposable PostgreSQL
        run: docker compose up -d --wait postgres

      - name: Run unit and contract tests
        run: >-
          uv run pytest
          -m "not integration and not dataset and not postgres and not cloud"

      - name: Run integration tests
        run: >-
          uv run pytest
          -m "integration and not dataset and not postgres
          and not airflow and not mlflow and not cloud"

      - name: Run real local MLflow integration tests
        run: uv run pytest -m "mlflow and not dataset and not cloud"

      - name: Run PostgreSQL migration and recovery tests
        run: uv run pytest -m "postgres and not dataset and not cloud"

      - name: Prepare disposable shared object directory
        run: install -d -m 0777 artifacts/cloud-objects

      - name: Build pinned Airflow image
        run: docker compose build airflow

      - name: Start Airflow LocalExecutor runtime
        run: docker compose up -d --wait airflow

      - name: Run Airflow DAG, retry, and backfill tests
        run: uv run pytest -m "airflow and not dataset and not cloud"

      - name: Enforce product coverage
        run: >-
          uv run pytest -m "not dataset and not airflow and not cloud"
          --cov=src/predictive_maintenance
          --cov-branch
          --cov-report=term-missing
          --cov-fail-under=90

      - name: Check Markdown formatting
        run: uv run mdformat --check README.md CONTRIBUTING.md docs

      - name: Lint YAML
        run: uv run yamllint .

      - name: Audit Python dependencies
        run: uv run pip-audit

      - name: Stop disposable containers
        if: always()
        run: docker compose down --volumes
